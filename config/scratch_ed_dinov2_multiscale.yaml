# Experiment 3: encoder+decoder ONLY, FROM SCRATCH, DINOv2 ViT-L, MULTISCALE refine head, 4-frame.
#
# Same recipe as scratch_ed_dinov2_temporal.yaml (encoder+decoder only, official DINO pretraining,
# DINO frozen + LoRA), but the DPT head is the multi-scale coarse-to-fine refine head instead
# of the plain temporal head. Aux supervision uses the INVERSE-DEPTH space loss (aux_depth_space:
# disparity) so it matches the main SSI loss (see compute_aux_depth_loss_disp).
training:
  seed: 0
  checkpoint_dir: ./checkpoint/scratch_ed_dinov2_multiscale
  save_freq: 2000
  val_freq: 10000
  log_dir: ./logs/scratch_ed_dinov2_multiscale
  freeze_mode: default        # DINOv2 base frozen; DPT head + LoRA adapters trainable
  grad_accum: 1               # per-GPU batch=4, 2 GPUs -> effective batch = 8
  aux_depth_weight: 1.0       # multi-scale head: supervise every scale's refined depth
  aux_depth_space: disparity  # inverse-depth-space aux (SSI-aligned), matches main loss

optimizer:
  kind: adamw
  learning_rate: 1.0e-4
  dec_lr: 1.0e-4
  other_lr: 1.0e-4
  lora_lr: 1.0e-4
  weight_decay: 0.01

dataset:
  train:
    mode: train
    data_dirs: ['${oc.env:VKITTI_ROOT,/mnt/workspace/vkitti/vkitti/}']
    crop_size: 518
    seq_len: 4
  val:
    mode: train
    data_dirs: []
    crop_size: 518
    seq_len: 4

dataloader:
  batch_size: 8              # total across GPUs; per-GPU = 8 // num_processes(2) = 4
  num_workers: 8

model:
  video_path: null              # NEVER load GemDepth weights; head is random-init
  dinov2_weights: "timm://vit_large_patch14_dinov2.lvd142m"  # official DINOv2 via HF
  require_pretrained_backbone: true
  encoder_decoder_only: true
  head_type: multiscale
  use_gem: false
  use_astt: false
  use_temporal: true
  lora: true
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.0

encoder: 'vitl'
pose_flag: false
num_gpus: 2
total_step: 20000
project_name: scratch_ed_dinov2_multiscale
resume: false
