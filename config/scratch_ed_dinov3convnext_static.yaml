# Experiment 1c: encoder+decoder ONLY, FROM SCRATCH, DINOv3 ConvNeXt-small, STATIC single-frame.
#
# Same static single-frame recipe as experiments 1a/1b. NO gemdepth.pth: only the official
# DINOv3 ConvNeXt-small backbone weights are loaded from timm/HF; the hierarchical DPT head
# is initialized from scratch. crop_size 448 is shared by all three backbone ablations and is
# divisible by the deepest ConvNeXt feature stride (32).
training:
  seed: 0
  checkpoint_dir: ./checkpoint/scratch_ed_dinov3convnext_static
  save_freq: 2000
  val_freq: 10000
  log_dir: ./logs/scratch_ed_dinov3convnext_static
  freeze_mode: default        # backbone frozen; DPT head + LoRA adapters trainable
  grad_accum: 1               # per-GPU batch=4, 2 GPUs -> effective batch = 8
  aux_depth_weight: 0.0

optimizer:
  kind: adamw
  learning_rate: 1.0e-4
  dec_lr: 1.0e-4
  other_lr: 1.0e-4
  lora_lr: 1.0e-4
  weight_decay: 0.01

dataset:
  train:
    mode: train
    data_dirs: ['${oc.env:VKITTI_ROOT,/mnt/workspace/vkitti/vkitti/}']
    crop_size: 448            # shared 1a/1b/1c crop; deepest ConvNeXt stride is 32
    seq_len: 1
  val:
    mode: train
    data_dirs: []
    crop_size: 448
    seq_len: 1

dataloader:
  batch_size: 8              # total across GPUs; per-GPU = 8 // num_processes(2) = 4
  num_workers: 8

model:
  video_path: null              # no gemdepth.pth; only the DINOv3 backbone is pretrained
  backbone: dinov3_convnext_s   # DINOv3 ConvNeXt-small (LVD-1689M) via timm/HF
  backbone_weights: null        # null -> official timm/HF pretrained weights
  require_pretrained_backbone: true
  encoder_decoder_only: true
  head_type: temporal           # static DPT decoder; temporal modules disabled below
  use_gem: false
  use_astt: false
  use_temporal: false           # static single-frame: no temporal modeling
  lora: true
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.0

encoder: 'vitl'                 # borrows decoder features/out_channels; ConvNeXt stage dims are used automatically
pose_flag: false
num_gpus: 2
total_step: 20000
project_name: scratch_ed_dinov3convnext_static
resume: false
