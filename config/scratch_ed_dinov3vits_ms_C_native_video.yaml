# Exp 8-C (native-resolution fix + native video loss): multiscale head at NATIVE pyramid
# resolution + MultiScaleVideoDepthLoss (the multi-scale VideoDepthLoss: disparity space, SSI
# data term + multi-scale gradient matching + temporal stability; pose term OFF because
# pose_flag=false here). This is 师兄's second loss and the fix the visualization pointed to
# (native errors were regional/scale, not edges -> disparity+SSI should help most).
#
# IMPORTANT — eval space FLIPS: supervised in disparity space, so the output is disparity-like ->
# eval it WITHOUT the 1/D inversion (opposite of exp A/B). Do a short smoke run first (loss
# decreasing + output not all-zero) before the full 20k, since metric-init head + disparity loss
# is the metric/disparity tension that caused historical collapse.
training:
  seed: 0
  checkpoint_dir: ./checkpoint/scratch_ed_dinov3vits_ms_C_native_video
  save_freq: 2000
  val_freq: 10000
  log_dir: ./logs/scratch_ed_dinov3vits_ms_C_native_video
  freeze_mode: default
  grad_accum: 1
  aux_depth_weight: 1.0
  aux_depth_space: disparity

optimizer:
  kind: adamw
  learning_rate: 1.0e-4
  dec_lr: 1.0e-4
  other_lr: 1.0e-4
  lora_lr: 1.0e-4
  weight_decay: 0.01

dataset:
  train:
    mode: train
    data_dirs: ['${oc.env:VKITTI_ROOT,/mnt/workspace/vkitti/vkitti/}']
    crop_size: 448
    seq_len: 4
  val:
    mode: train
    data_dirs: []
    crop_size: 448
    seq_len: 4

dataloader:
  batch_size: 8
  num_workers: 8

model:
  video_path: null
  backbone: dinov3_vitsplus
  backbone_weights: null
  require_pretrained_backbone: true
  encoder_decoder_only: true
  head_type: multiscale
  use_gem: false
  use_astt: false
  use_temporal: true
  lora: true
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.0
  multiscale_native_res: true    # native pyramid (real coarse-to-fine)

encoder: 'vits'
pose_flag: false
multiscale_loss: video           # MultiScaleVideoDepthLoss (disparity + SSI + gradient + temporal)
num_gpus: 1
total_step: 20000
project_name: scratch_ed_dinov3vits_ms_C_native_video
resume: false
