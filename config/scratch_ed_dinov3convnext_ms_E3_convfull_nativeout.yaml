# Exp E3 (ConvNeXt): full-resolution CONVOLUTION but NATIVE-resolution OUTPUT
# (fullres_mode=all_native, no depth feedback). Every scale's delta head runs its conv layers at
# full input resolution (288x960), then the predicted delta is resampled back to that scale's
# native pyramid resolution before the residual add -> the returned per-scale depths stay at native
# resolution, so the real coarse-to-fine RESOLUTION supervision (loss downsamples GT per scale) is
# preserved, unlike E1/E2b. This is the alternative reading of 师兄's proposal: "conv at full res,
# but keep coarse-to-fine". Video loss.
# Do a short smoke run first (loss decreasing, output not all-zero) before the full 20k.
training:
  seed: 0
  checkpoint_dir: ./checkpoint/scratch_ed_dinov3convnext_ms_E3_convfull_nativeout
  save_freq: 2000
  val_freq: 10000
  log_dir: ./logs/scratch_ed_dinov3convnext_ms_E3_convfull_nativeout
  freeze_mode: default
  grad_accum: 1
  aux_depth_weight: 1.0
  aux_depth_space: disparity

optimizer:
  kind: adamw
  learning_rate: 1.0e-4
  dec_lr: 1.0e-4
  other_lr: 1.0e-4
  lora_lr: 1.0e-4
  weight_decay: 0.01

dataset:
  train:
    mode: train
    data_dirs: ['${oc.env:VKITTI_ROOT,/mnt/workspace/vkitti/vkitti/}']
    crop_size: 448
    seq_len: 4
  val:
    mode: train
    data_dirs: []
    crop_size: 448
    seq_len: 4

dataloader:
  batch_size: 8
  num_workers: 8

model:
  video_path: null
  backbone: dinov3_convnext_s
  backbone_weights: null
  require_pretrained_backbone: true
  encoder_decoder_only: true
  head_type: multiscale
  use_gem: false
  use_astt: false
  use_temporal: true
  lora: true
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.0
  multiscale_native_res: true
  multiscale_fullres_mode: all_native   # conv at full res, output resampled back to native res
  multiscale_depth_feedback: false

encoder: 'vitl'
pose_flag: false
multiscale_loss: video           # MultiScaleVideoDepthLoss (disparity + SSI + gradient + temporal)
num_gpus: 1
total_step: 20000
project_name: scratch_ed_dinov3convnext_ms_E3_convfull_nativeout
resume: false
