# Eval-only config for the earlier Method-A run (finest-scale feature upsampled to full resolution
# before its delta head). That run was launched from the base C config + CLI dir override while the
# head still hard-coded Method A; after the fullres_mode refactor the base C config defaults to
# 'none', so evaluating that checkpoint needs this config which pins multiscale_fullres_mode=last so
# infer.py rebuilds the exact trained architecture/behaviour. ConvNeXt + video loss -> eval WITHOUT
# 1/D inversion (disparity output), same as C.
training:
  seed: 0
  checkpoint_dir: ./checkpoint/scratch_ed_dinov3convnext_ms_C_fullres
  save_freq: 2000
  val_freq: 10000
  log_dir: ./logs/scratch_ed_dinov3convnext_ms_C_fullres
  freeze_mode: default
  grad_accum: 1
  aux_depth_weight: 1.0
  aux_depth_space: disparity

optimizer:
  kind: adamw
  learning_rate: 1.0e-4
  dec_lr: 1.0e-4
  other_lr: 1.0e-4
  lora_lr: 1.0e-4
  weight_decay: 0.01

dataset:
  train:
    mode: train
    data_dirs: ['${oc.env:VKITTI_ROOT,/mnt/workspace/vkitti/vkitti/}']
    crop_size: 448
    seq_len: 4
  val:
    mode: train
    data_dirs: []
    crop_size: 448
    seq_len: 4

dataloader:
  batch_size: 8
  num_workers: 8

model:
  video_path: null
  backbone: dinov3_convnext_s
  backbone_weights: null
  require_pretrained_backbone: true
  encoder_decoder_only: true
  head_type: multiscale
  use_gem: false
  use_astt: false
  use_temporal: true
  lora: true
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.0
  multiscale_native_res: true
  multiscale_fullres_mode: last      # Method A: finest scale only, conv+output at full resolution
  multiscale_depth_feedback: false

encoder: 'vitl'
pose_flag: false
multiscale_loss: video
num_gpus: 1
total_step: 20000
project_name: scratch_ed_dinov3convnext_ms_C_fullres
resume: false
