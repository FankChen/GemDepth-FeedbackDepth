# Single-A100 METHOD arm: error-map DPT head (photometric error injection), freeze everything
# except the head, fine-tune on VKITTI from the pretrained GemDepth weights, evaluate on KITTI.
# Only the DPT head differs from single_a100_baseline.yaml, so the comparison is controlled.
training:
  seed: 0
  checkpoint_dir: ./checkpoint/single_a100_errormap
  save_freq: 2000
  val_freq: 10000
  log_dir: ./logs/single_a100_errormap
  freeze_mode: head_only      # only the DPT head (incl. error-map modules) is trainable
  grad_accum: 4               # effective batch = batch_size * grad_accum
  aux_depth_weight: 0.1       # supervise the per-stage coarse depths used to build error maps

optimizer:
  kind: adamw
  learning_rate: 1.0e-4
  dec_lr: 1.0e-5
  other_lr: 1.0e-5            # head params land in the "other" group
  weight_decay: 0.01

dataset:
  train:
    mode: train
    data_dirs: ['/home/izi2sgh/MYDATA/quanjie/liren/datasets/vkitti_1.3.1/']
    crop_size: 518
    seq_len: 16

  val:
    mode: train
    data_dirs: []
    crop_size: 518
    seq_len: 16

dataloader:
  batch_size: 1
  num_workers: 8

model:
  video_path: "./checkpoint/gemdepth.pth"
  head_type: errormap

encoder: 'vitl'
pose_flag: True
num_gpus: 1
total_step: 10000
project_name: video_single_a100_errormap
resume: false
