# Experiment 1b: encoder+decoder ONLY, FROM SCRATCH, DINOv3 ViT-S+, STATIC single-frame (seq_len=1).
#
# Same static single-frame recipe as scratch_ed_dinov2_static.yaml, but backbone = DINOv3 ViT-S+
# (LVD-1689M) pulled from timm/HF. NO gemdepth.pth (video_path: null) -- only the DINOv3 backbone
# is pretrained (frozen + LoRA); the DPT head is trained from scratch. crop_size 448 matches 1a/1c
# for a fair backbone comparison (divisible by 16 for patch16).
training:
  seed: 0
  checkpoint_dir: ./checkpoint/scratch_ed_dinov3vits_static
  save_freq: 2000
  val_freq: 10000
  log_dir: ./logs/scratch_ed_dinov3vits_static
  freeze_mode: default        # backbone frozen; DPT head + LoRA adapters trainable
  grad_accum: 1               # per-GPU batch=4, 2 GPUs -> effective batch = 8
  aux_depth_weight: 0.0

optimizer:
  kind: adamw
  learning_rate: 1.0e-4
  dec_lr: 1.0e-4
  other_lr: 1.0e-4
  lora_lr: 1.0e-4
  weight_decay: 0.01

dataset:
  train:
    mode: train
    data_dirs: ['${oc.env:VKITTI_ROOT,/mnt/workspace/vkitti/vkitti/}']
    crop_size: 448            # patch16 -> must be divisible by 16 (448/16=28); matches 1a/1c
    seq_len: 1
  val:
    mode: train
    data_dirs: []
    crop_size: 448
    seq_len: 1

dataloader:
  batch_size: 8              # total across GPUs; per-GPU = 8 // num_processes(2) = 4
  num_workers: 8

model:
  video_path: null              # no gemdepth.pth; only the DINOv3 backbone is pretrained
  backbone: dinov3_vitsplus     # DINOv3 ViT-S+ (LVD-1689M) via timm/HF
  backbone_weights: null        # null -> timm pretrained (HF); or a local .pth path
  head_type: temporal
  use_gem: false
  use_astt: false
  use_temporal: false           # static single-frame: no temporal modeling
  lora: true
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.0

encoder: 'vitl'                 # borrows model_configs features/out_channels; DPT in_channels = enc_embed_dim(384) auto
pose_flag: false
num_gpus: 2
total_step: 20000
project_name: scratch_ed_dinov3vits_static
resume: false
