# Experiment 7 (multiscale-SOFTPLUS fix): encoder+decoder ONLY, FROM SCRATCH, DINOv3 ViT-S+, 4-frame.
#
# Identical to scratch_ed_dinov3vits_multiscale.yaml EXCEPT head_type=multiscale_softplus.
# Same raw-delta multiscale head (signed per-scale delta, cross-scale .detach(), disparity aux),
# but the final inverse-depth output is squashed through softplus -> strictly positive with NO
# dead zone. Fixes the from-scratch all-zero collapse WITHOUT changing the multiscale design
# (the .detach() gradient-truncation is intentionally UNCHANGED). See model/dpt_multiscale_softplus.py.
training:
  seed: 0
  checkpoint_dir: ./checkpoint/scratch_ed_dinov3vits_multiscale_softplus
  save_freq: 2000
  val_freq: 10000
  log_dir: ./logs/scratch_ed_dinov3vits_multiscale_softplus
  freeze_mode: default        # backbone frozen; DPT head + LoRA adapters trainable
  grad_accum: 1               # per-GPU batch=4, 2 GPUs -> effective batch = 8
  aux_depth_weight: 1.0       # multi-scale head: supervise every scale's refined depth
  aux_depth_space: disparity  # inverse-depth-space aux (SSI-aligned), matches main loss

optimizer:
  kind: adamw
  learning_rate: 1.0e-4
  dec_lr: 1.0e-4
  other_lr: 1.0e-4
  lora_lr: 1.0e-4
  weight_decay: 0.01

dataset:
  train:
    mode: train
    data_dirs: ['${oc.env:VKITTI_ROOT,/mnt/workspace/vkitti/vkitti/}']
    crop_size: 448            # patch16 -> 448/16=28
    seq_len: 4
  val:
    mode: train
    data_dirs: []
    crop_size: 448
    seq_len: 4

dataloader:
  batch_size: 8              # total across GPUs; per-GPU = 8 // num_processes(2) = 4
  num_workers: 8

model:
  video_path: null              # no gemdepth.pth; only the DINOv3 backbone is pretrained
  backbone: dinov3_vitsplus     # DINOv3 ViT-S+ (LVD-1689M) via timm/HF
  backbone_weights: null        # null -> timm pretrained (HF); or a local .pth path
  require_pretrained_backbone: true
  encoder_decoder_only: true
  head_type: multiscale_softplus
  use_gem: false
  use_astt: false
  use_temporal: true            # 4-frame temporal modeling
  lora: true
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.0

encoder: 'vitl'                 # borrows model_configs features/out_channels; DPT in_channels = enc_embed_dim auto
pose_flag: false
num_gpus: 2
total_step: 20000
project_name: scratch_ed_dinov3vits_multiscale_softplus
resume: false
