# From-scratch baseline: ONLY the DINOv2 backbone is kept (pretrained + FROZEN). head / GEM(pose) /
# ASTT(spatial-temporal) and the rest are trained FROM SCRATCH on VKITTI + tartanair. Purpose: test
# whether the released pretrained head was overfit -> gives a fair, re-trainable baseline our
# methods can be compared against. load_backbone_only=true keeps only 'pretrained.*' (DINOv2) keys.
training:
  seed: 0
  checkpoint_dir: ./checkpoint/single_a100_baseline_scratch_bb
  save_freq: 5000
  val_freq: 100000
  log_dir: ./logs/single_a100_baseline_scratch_bb
  freeze_mode: non_backbone      # freeze DINOv2, train everything else from scratch
  grad_accum: 4
  aux_depth_weight: 0.0

optimizer:
  kind: adamw
  learning_rate: 2.0e-4          # from-scratch -> larger LR than fine-tuning
  dec_lr: 2.0e-4
  other_lr: 2.0e-4
  weight_decay: 0.05

dataset:
  train:
    mode: train
    data_dirs: ['${oc.env:VKITTI_ROOT,/home/izi2sgh/MYDATA/vkitti/}', '${oc.env:TARTANAIR_ROOT,/mnt/workspace/tartanair}']
    crop_size: 518
    seq_len: 16
  val:
    mode: train
    data_dirs: []
    crop_size: 518
    seq_len: 16

dataloader:
  batch_size: 1
  num_workers: 8

model:
  video_path: "./checkpoint/gemdepth.pth"
  load_backbone_only: true       # keep only DINOv2 backbone; head/GEM/ASTT random-init
  head_type: temporal

encoder: 'vitl'
pose_flag: True
num_gpus: 1
total_step: 40000
project_name: video_single_a100_baseline_scratch_bb
resume: false
