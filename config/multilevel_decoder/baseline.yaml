# @package _global_
# Baseline for iterative decoder development. This is derived from
# scratch/dinov3_convnext/scratch_ed_dinov3convnext_temporal.yaml and differs
# only in experiment output names plus the explicit decoder selector.
training:
  seed: 0
  checkpoint_dir: ./checkpoint/iterative_decoder/baseline
  save_freq: 2000
  val_freq: 10000
  log_dir: ./logs/iterative_decoder/baseline
  freeze_mode: default
  grad_accum: 1
  aux_depth_weight: 0.0

optimizer:
  kind: adamw
  learning_rate: 1.0e-4
  dec_lr: 1.0e-4
  other_lr: 1.0e-4
  lora_lr: 1.0e-4
  weight_decay: 0.01

dataset:
  train:
    mode: train
    data_dirs: ['${oc.env:VKITTI_ROOT,/mnt/workspace/vkitti/vkitti}']
    crop_size: 448
    seq_len: 4
  val:
    mode: val
    data_dirs: ['${oc.env:VKITTI_ROOT,/mnt/workspace/vkitti/vkitti}']
    crop_size: 448
    seq_len: 4

dataloader:
  batch_size: 8
  num_workers: 8

model:
  video_path: null
  backbone: DINOv3ConvNeXtSmallBackbone
  backbone_weights: null
  require_pretrained_backbone: true
  encoder_decoder_only: true
  decoder: DPTHeadTemporalConvNeXt
  use_gem: false
  use_astt: false
  use_temporal: true
  lora: true
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.0

encoder: vitl
pose_flag: false
num_gpus: 2
total_step: 20000
project_name: iterative_decoder_baseline
resume: false
