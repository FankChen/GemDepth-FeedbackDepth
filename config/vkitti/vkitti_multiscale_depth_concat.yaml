# @package _global_
# VKITTI multiscale experiment: every refinement level predicts at full
# resolution from the concatenation of its upsampled feature and the encoded
# previous-level depth. The depth feedback path is always enabled by the
# decoder; multiscale_depth_feedback is retained only for config compatibility.
training:
  seed: 0
  checkpoint_dir: ./checkpoint/vkitti_multiscale_depth_concat
  save_freq: 2000
  val_freq: 2000
  log_dir: ./logs/vkitti_multiscale_depth_concat
  freeze_mode: default
  grad_accum: 1

optimizer:
  kind: adamw
  learning_rate: 1.0e-4
  dec_lr: 1.0e-4
  other_lr: 1.0e-4
  lora_lr: 1.0e-4
  weight_decay: 0.01

dataset:
  train:
    mode: train
    data_dirs: ['${oc.env:VKITTI_ROOT,/mnt/workspace/vkitti/vkitti}']
    crop_size: 448
    seq_len: 4
  val:
    mode: val
    data_dirs: ['${oc.env:VKITTI_ROOT,/mnt/workspace/vkitti/vkitti}']
    crop_size: 448
    seq_len: 4

dataloader:
  batch_size: 32
  num_workers: 8

model:
  video_path: null
  backbone: DINOv3ConvNeXtSmallBackbone
  backbone_weights: null
  require_pretrained_backbone: true
  encoder_decoder_only: true
  decoder: DPTHeadMultiScaleRefineConvNeXt
  use_gem: false
  use_astt: false
  use_temporal: true
  lora: true
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.0
  multiscale_native_res: true
  multiscale_fullres_mode: all
  multiscale_depth_feedback: true
  multiscale_fp32_head: true

encoder: vitl
pose_flag: false
multiscale_loss: video
multiscale_scale_weights: [1.0, 1.0, 1.0, 1.0]
multiscale_normalize_scale_weights: false
num_gpus: 2
total_step: 10000
project_name: vkitti_multiscale_depth_concat
resume: false
