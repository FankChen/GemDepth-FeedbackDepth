# @package _global_
# Clean baseline: DINOv2 (frozen, LoRA-finetuned) + DPT temporal head ONLY.
# GEM and ASTT are disabled -> this is the plain VideoDepthAnything-style baseline, trained
# from scratch on VKITTI. The DINOv2 backbone loads official ViT-L/14 pretrained weights and is
# frozen; only LoRA adapters (inside DINOv2) and the DPT head (random init) are trained.
training:
  seed: 0
  checkpoint_dir: ./checkpoint/vkitti_baseline
  save_freq: 2000
  val_freq: 10000
  log_dir: ./logs/vkitti_baseline
  freeze_mode: default        # DINOv2 base frozen; head + LoRA trainable
  grad_accum: 4               # effective batch = batch_size * grad_accum
  aux_depth_weight: 0.0

optimizer:
  kind: adamw
  learning_rate: 1.0e-4
  dec_lr: 1.0e-5              # (unused: no ASTT spatial/time blocks in this baseline)
  other_lr: 1.0e-4           # DPT head is trained from scratch -> full lr
  lora_lr: 1.0e-4            # LoRA adapters on the frozen DINOv2 backbone
  weight_decay: 0.01

dataset:
  train:
    mode: train
    data_dirs: ['${oc.env:VKITTI_ROOT,/home/izi2sgh/MYDATA/vkitti/}']
    crop_size: 518
    seq_len: 4

  val:
    mode: train
    data_dirs: []
    crop_size: 518
    seq_len: 4

dataloader:
  batch_size: 1
  num_workers: 8

model:
  backbone: DINOv2Backbone
  video_path: null                                          # do NOT load gemdepth.pth
  backbone_weights: ./checkpoint/dinov2_vitl14_pretrain.pth   # official DINOv2 ViT-L/14 backbone
  decoder: DPTHeadTemporal
  use_gem: false
  use_astt: false
  lora: true
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.0

encoder: 'vitl'
pose_flag: false
num_gpus: 1
total_step: 20000
project_name: vkitti_baseline
resume: false
