# @package _global_
# Path C -- iterate a weight-shared update operator.
#
# Walks the coarse-to-fine ladder four times, reusing one ConvGRU per scale on
# every round. Parameter count is therefore independent of refine_rounds, which
# is exactly what separates "iterating helps" from "a bigger head helps" -- the
# confound that currently explains the in-domain gain of the base head.
#
# Deliberately adds no new evidence: the pyramid features are identical every
# round, so this is the null hypothesis for the error-map arm. 4 rounds x 4
# scales = 16 supervised outputs; leaving multiscale_scale_weights unset makes
# the loss average over all of them.
defaults:
  - vkitti_multiscale_depth_concat
  - _self_

training:
  checkpoint_dir: ./checkpoint/vkitti_ms_iter4
  log_dir: ./logs/vkitti_ms_iter4
  # 4 rounds keep every round's activations, and the GRU follows the pyramid up to
  # 448x448, so backward needs gradients for all 16 of them at once. Measured:
  # micro-batch 16 peaks at 137 GB and still OOMs on a 140 GB card. Quarter the
  # micro-batch and accumulate four times -- effective batch stays 32, so this arm
  # is still comparable to the rest.
  grad_accum: 4

dataloader:
  batch_size: 8

model:
  decoder: DPTHeadMultiScaleIterConvNeXt
  decoder_kwargs:
    refine_rounds: 4
    hidden_dim: 64

multiscale_scale_weights: null
multiscale_normalize_scale_weights: true
project_name: vkitti_ms_iter4
