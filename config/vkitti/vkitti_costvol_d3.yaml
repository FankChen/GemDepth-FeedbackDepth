# @package _global_
# Same head as vkitti_costvol, only the depth hypotheses move.
#
# The first run put the volume's hypotheses in the wrong place. Inverse-depth uniform
# sampling over [0.5m, 80m] with 32 samples lands like this:
#
#     index 0 -> 80m, 1 -> 13m, 2 -> 7.1m, 3 -> 4.9m, 5 -> 3.0m, ... 31 -> 0.5m
#
# so 80m..3m -- essentially the entire content of a driving scene, and exactly the range
# train.py supervises -- gets 6 of the 32 hypotheses, while 26 are spent inside the first
# three metres in front of the bumper. The volume had no usable depth resolution, which
# is visible in the loss: the softargmin initialisation barely improved over 10k steps
# (2.8742 -> 2.7081) while the GRU iterations did all the work (-> 0.5220).
#
# IGEV-MVS samples this way for DTU, where depth spans 0.4-1.5m and uniform-in-inverse is
# the right choice. Raising the near plane to 3m is the adaptation that port needed:
#
#     index 0 -> 80m, 1 -> 43.9m, 3 -> 23.0m, 5 -> 15.4m, 10 -> 8.5m, 20 -> 4.4m, 31 -> 3m
#
# Everything else is untouched, so the difference against vkitti_costvol measures how much
# of that arm's failure was the sampling rather than the architecture.
defaults:
  - vkitti_costvol
  - _self_

training:
  checkpoint_dir: ./checkpoint/vkitti_costvol_d3
  log_dir: ./logs/vkitti_costvol_d3

model:
  decoder_kwargs:
    depth_min: 3.0

project_name: vkitti_costvol_d3
