# Experiment 7 (multiscale, PRIMARY): encoder+decoder ONLY, FROM SCRATCH, DINOv3 ConvNeXt-s,
# MULTISCALE coarse-to-fine refine head, 4-frame.
#
# Same from-scratch recipe as scratch_ed_dinov3convnext_temporal.yaml, but head_type=multiscale
# on the ConvNeXt hierarchical pyramid -> DPTHeadMultiScaleRefineConvNeXt (new): the same raw-delta
# `depth_i = upsample(depth_{i-1}).detach() + delta_Z_i` recursion as DPTHeadMultiScaleRefine, but
# fed the native ConvNeXt NCHW pyramid (per-level 1x1 proj + Identity resize). Aux supervision is
# in INVERSE-DEPTH space (aux_depth_space=disparity) to match the main SSI loss.
#
# NOTE: from-scratch raw-delta multiscale collapsed for DINOv2 (exp 3). Monitor output health.
training:
  seed: 0
  checkpoint_dir: ./checkpoint/scratch_ed_dinov3convnext_multiscale
  save_freq: 2000
  val_freq: 10000
  log_dir: ./logs/scratch_ed_dinov3convnext_multiscale
  freeze_mode: default        # backbone frozen; DPT head + LoRA adapters trainable
  grad_accum: 1               # per-GPU batch=4, 2 GPUs -> effective batch = 8
  aux_depth_weight: 1.0       # multi-scale head: supervise every scale's refined depth
  aux_depth_space: disparity  # inverse-depth-space aux (SSI-aligned), matches main loss

optimizer:
  kind: adamw
  learning_rate: 1.0e-4
  dec_lr: 1.0e-4
  other_lr: 1.0e-4
  lora_lr: 1.0e-4
  weight_decay: 0.01

dataset:
  train:
    mode: train
    data_dirs: ['${oc.env:VKITTI_ROOT,/mnt/workspace/vkitti/vkitti/}']
    crop_size: 448            # deepest ConvNeXt stride is 32 -> 448/32=14
    seq_len: 4
  val:
    mode: train
    data_dirs: []
    crop_size: 448
    seq_len: 4

dataloader:
  batch_size: 8              # total across GPUs; per-GPU = 8 // num_processes(2) = 4
  num_workers: 8

model:
  video_path: null              # no gemdepth.pth; only the DINOv3 backbone is pretrained
  backbone: dinov3_convnext_s   # DINOv3 ConvNeXt-small (LVD-1689M) via timm/HF
  backbone_weights: null        # null -> official timm/HF pretrained weights
  require_pretrained_backbone: true
  encoder_decoder_only: true
  head_type: multiscale         # hierarchical multiscale refine head (DPTHeadMultiScaleRefineConvNeXt)
  use_gem: false
  use_astt: false
  use_temporal: true            # 4-frame temporal modeling
  lora: true
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.0

encoder: 'vitl'                 # borrows decoder features/out_channels; ConvNeXt stage dims used automatically
pose_flag: false
num_gpus: 2
total_step: 20000
project_name: scratch_ed_dinov3convnext_multiscale
resume: false
