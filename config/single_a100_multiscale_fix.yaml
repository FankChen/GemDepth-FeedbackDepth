# Single-A100 METHOD arm (FIX): multi-scale coarse-to-fine depth-refinement DPT head,
# with the auxiliary multi-scale supervision moved to INVERSE-DEPTH space (matching the
# main SSI loss) instead of the original absolute metric-depth L1.
#
# WHY: the original single_a100_multiscale.yaml supervises aux depths with absolute
# metric-depth L1 (compute_aux_depth_loss, aux_depth_weight=1.0). That pulls the model
# output into metric-depth space while the main loss supervises inverse depth (1/depth).
# The two losses fight, the output ends up in metric-depth space (median ~26 m), and the
# inverse-depth-based evaluator mis-aligns it (KITTI AbsRel inflated to ~0.24). This copy
# changes ONLY one thing:
#     training.aux_depth_space: disparity   (default 'depth' = original behaviour;
#                                            value 'disparity' = MiDaS-style alias for inverse depth)
# so the aux branch supervises the SAME inverse-depth space (with per-sample SSI alignment)
# as the main loss. Head, data, freezing, lr, steps are identical to single_a100_multiscale.
#
# The original single_a100_multiscale.yaml and dpt_multiscale.py are left UNTOUCHED.
training:
  seed: 0
  checkpoint_dir: ./checkpoint/single_a100_multiscale_fix
  save_freq: 2000
  val_freq: 10000
  log_dir: ./logs/single_a100_multiscale_fix
  freeze_mode: head_only      # only the DPT head (incl. delta_heads) is trainable
  grad_accum: 4               # effective batch = batch_size * grad_accum
  aux_depth_weight: 1.0       # same weight as the original arm — we change ONLY the space
  aux_depth_space: disparity  # NEW: supervise aux depths in inverse-depth space (SSI-aligned; value name 'disparity' = MiDaS alias)

optimizer:
  kind: adamw
  learning_rate: 1.0e-4
  dec_lr: 1.0e-5
  other_lr: 1.0e-5            # head params land in the "other" group
  weight_decay: 0.01

dataset:
  train:
    mode: train
    data_dirs: ['${oc.env:VKITTI_ROOT,/home/izi2sgh/MYDATA/vkitti/}']
    crop_size: 518
    seq_len: 16

  val:
    mode: train
    data_dirs: []
    crop_size: 518
    seq_len: 16

dataloader:
  batch_size: 1
  num_workers: 8

model:
  video_path: "./checkpoint/gemdepth.pth"
  head_type: multiscale
  use_temporal: true

encoder: 'vitl'
pose_flag: True
num_gpus: 1
total_step: 10000
project_name: video_single_a100_multiscale_fix
resume: false
