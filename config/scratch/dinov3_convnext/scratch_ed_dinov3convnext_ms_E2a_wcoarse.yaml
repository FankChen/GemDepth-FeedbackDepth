# @package _global_
# Exp E2a + coarse-heavy loss weights (粗多细少): E2a (native + depth feedback) with per-scale loss
# weights (coarse->fine) = [0.4, 0.3, 0.2, 0.1], so the coarsest scale gets the most supervision and
# the finest (eval) scale the least. Tests whether front-loading the coarse "foundation" of the
# residual chain helps. The loss normalizes weights to sum 1, so only ratios matter. Video loss.
# Do a short smoke run first (loss decreasing, output not all-zero) before the full 20k.
training:
  seed: 0
  checkpoint_dir: ./checkpoint/scratch_ed_dinov3convnext_ms_E2a_wcoarse
  save_freq: 2000
  val_freq: 10000
  log_dir: ./logs/scratch_ed_dinov3convnext_ms_E2a_wcoarse
  freeze_mode: default
  grad_accum: 1
  aux_depth_weight: 1.0
  aux_depth_space: disparity

optimizer:
  kind: adamw
  learning_rate: 1.0e-4
  dec_lr: 1.0e-4
  other_lr: 1.0e-4
  lora_lr: 1.0e-4
  weight_decay: 0.01

dataset:
  train:
    mode: train
    data_dirs: ['${oc.env:VKITTI_ROOT,/mnt/workspace/vkitti/vkitti/}']
    crop_size: 448
    seq_len: 4
  val:
    mode: train
    data_dirs: []
    crop_size: 448
    seq_len: 4

dataloader:
  batch_size: 8
  num_workers: 8

model:
  video_path: null
  backbone: DINOv3ConvNeXtSmallBackbone
  backbone_weights: null
  require_pretrained_backbone: true
  encoder_decoder_only: true
  decoder: DPTHeadMultiScaleRefineConvNeXt
  use_gem: false
  use_astt: false
  use_temporal: true
  lora: true
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.0
  multiscale_native_res: true
  multiscale_fullres_mode: none      # native pyramid resolution (coarse-to-fine preserved)
  multiscale_depth_feedback: true    # encode running depth z, concat onto feature

encoder: 'vitl'
pose_flag: false
multiscale_loss: video           # MultiScaleVideoDepthLoss (disparity + SSI + gradient + temporal)
multiscale_scale_weights: [0.4, 0.3, 0.2, 0.1]   # coarse -> fine (coarse-heavy)
num_gpus: 1
total_step: 20000
project_name: scratch_ed_dinov3convnext_ms_E2a_wcoarse
