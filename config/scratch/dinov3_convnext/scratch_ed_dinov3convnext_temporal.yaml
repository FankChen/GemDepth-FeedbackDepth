# @package _global_
# Experiment 7 (temporal): encoder+decoder ONLY, FROM SCRATCH, DINOv3 ConvNeXt-small, 4-frame.
#
# Same from-scratch recipe as scratch_ed_dinov3convnext_static.yaml (only the DINOv3 ConvNeXt-s
# backbone is pretrained, frozen + LoRA; hierarchical DPT head trained from scratch), but
# 4-frame temporal (seq_len=4, use_temporal=true): DPTHeadTemporalConvNeXt already supports the
# temporal motion modules. crop_size 448 matches the static ablation (1a/1b/1c) and is divisible
# by the deepest ConvNeXt stride (32) and by patch16 used by the ViT arms.
training:
  seed: 0
  checkpoint_dir: ./checkpoint/scratch_ed_dinov3convnext_temporal
  save_freq: 2000
  val_freq: 10000
  log_dir: ./logs/scratch_ed_dinov3convnext_temporal
  freeze_mode: default        # backbone frozen; DPT head + LoRA adapters trainable
  grad_accum: 1               # per-GPU batch=4, 2 GPUs -> effective batch = 8
  aux_depth_weight: 0.0       # temporal head has no auxiliary depths

optimizer:
  kind: adamw
  learning_rate: 1.0e-4
  dec_lr: 1.0e-4
  other_lr: 1.0e-4
  lora_lr: 1.0e-4
  weight_decay: 0.01

dataset:
  train:
    mode: train
    data_dirs: ['${oc.env:VKITTI_ROOT,/mnt/workspace/vkitti/vkitti/}']
    crop_size: 448            # deepest ConvNeXt stride is 32 -> 448/32=14
    seq_len: 4
  val:
    mode: train
    data_dirs: []
    crop_size: 448
    seq_len: 4

dataloader:
  batch_size: 8              # total across GPUs; per-GPU = 8 // num_processes(2) = 4
  num_workers: 8

model:
  video_path: null              # no gemdepth.pth; only the DINOv3 backbone is pretrained
  backbone: DINOv3ConvNeXtSmallBackbone   # DINOv3 ConvNeXt-small (LVD-1689M) via timm/HF
  backbone_weights: null        # null -> official timm/HF pretrained weights
  require_pretrained_backbone: true
  encoder_decoder_only: true
  decoder: DPTHeadTemporalConvNeXt           # hierarchical DPT decoder; temporal modules enabled below
  use_gem: false
  use_astt: false
  use_temporal: true            # 4-frame temporal modeling
  lora: true
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.0

encoder: 'vitl'                 # borrows decoder features/out_channels; ConvNeXt stage dims used automatically
pose_flag: false
num_gpus: 2
total_step: 20000
project_name: scratch_ed_dinov3convnext_temporal
resume: false
