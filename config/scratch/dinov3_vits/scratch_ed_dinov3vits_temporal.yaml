# @package _global_
# Experiment 7 (temporal): encoder+decoder ONLY, FROM SCRATCH, DINOv3 ViT-S+, 4-frame temporal.
#
# Same from-scratch recipe as scratch_ed_dinov3vits_static.yaml (no gemdepth.pth; only the
# DINOv3 ViT-S+ backbone is pretrained, frozen + LoRA; DPT head trained from scratch), but
# 4-frame temporal (seq_len=4, use_temporal=true) so the temporal motion modules are active.
# crop_size 448 matches the DINOv3 static ablation (1b/1c) and is divisible by patch16 (28)
# and the ConvNeXt stride32 used by 1c, keeping the whole DINOv3 backbone ablation at one crop.
# (Change to 512 if you prefer to align with the DINOv2 temporal crop 518.)
training:
  seed: 0
  checkpoint_dir: ./checkpoint/scratch_ed_dinov3vits_temporal
  save_freq: 2000
  val_freq: 10000
  log_dir: ./logs/scratch_ed_dinov3vits_temporal
  freeze_mode: default        # backbone frozen; DPT head + LoRA adapters trainable
  grad_accum: 1               # per-GPU batch=4, 2 GPUs -> effective batch = 8
  aux_depth_weight: 0.0       # temporal head has no auxiliary depths

optimizer:
  kind: adamw
  learning_rate: 1.0e-4
  dec_lr: 1.0e-4
  other_lr: 1.0e-4
  lora_lr: 1.0e-4
  weight_decay: 0.01

dataset:
  train:
    mode: train
    data_dirs: ['${oc.env:VKITTI_ROOT,/mnt/workspace/vkitti/vkitti/}']
    crop_size: 448            # patch16 -> 448/16=28; also 448/32=14 (shared with 1c)
    seq_len: 4
  val:
    mode: train
    data_dirs: []
    crop_size: 448
    seq_len: 4

dataloader:
  batch_size: 8              # total across GPUs; per-GPU = 8 // num_processes(2) = 4
  num_workers: 8

model:
  video_path: null              # no gemdepth.pth; only the DINOv3 backbone is pretrained
  backbone: DINOv3ViTSPlusBackbone     # DINOv3 ViT-S+ (LVD-1689M) via timm/HF
  backbone_weights: null        # null -> timm pretrained (HF); or a local .pth path
  require_pretrained_backbone: true
  encoder_decoder_only: true
  decoder: DPTHeadTemporal
  use_gem: false
  use_astt: false
  use_temporal: true            # 4-frame temporal modeling
  lora: true
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.0

encoder: 'vitl'                 # borrows model_configs features/out_channels; DPT in_channels = enc_embed_dim auto
pose_flag: false
num_gpus: 2
total_step: 20000
project_name: scratch_ed_dinov3vits_temporal
resume: false
