# Experiment 1a: encoder+decoder ONLY, FROM SCRATCH, DINOv2 ViT-L, STATIC single-frame (seq_len=1).
#
# - No temporal modeling: use_temporal=false (DPT head drops motion_modules), seq_len=1.
#   The temporal-gradient loss is auto-skipped at T=1 (returns 0), so only the single-frame
#   spatial SSI + gradient-matching loss is used.
# - GEM + ASTT disabled. Official DINOv2 backbone frozen + LoRA;
#   DPT head trained from scratch. Eval on KITTI (inverse-depth SSI alignment).
# This is one of three backbones (1a=DINOv2) compared under identical static single-frame recipe.
training:
  seed: 0
  checkpoint_dir: ./checkpoint/scratch_ed_dinov2_static
  save_freq: 2000
  val_freq: 10000
  log_dir: ./logs/scratch_ed_dinov2_static
  freeze_mode: default        # DINOv2 base frozen; DPT head + LoRA adapters trainable
  grad_accum: 1               # per-GPU batch=4, 2 GPUs -> effective batch = 8
  aux_depth_weight: 0.0

optimizer:
  kind: adamw
  learning_rate: 1.0e-4
  dec_lr: 1.0e-4
  other_lr: 1.0e-4
  lora_lr: 1.0e-4
  weight_decay: 0.01

dataset:
  train:
    mode: train
    data_dirs: ['${oc.env:VKITTI_ROOT,/mnt/workspace/vkitti/vkitti/}']
    crop_size: 448           # divisible by 14/16/32 -> identical size across DINOv2/ViT-S+/ConvNeXt (fair backbone ablation)
    seq_len: 1
  val:
    mode: train
    data_dirs: []
    crop_size: 448
    seq_len: 1

dataloader:
  batch_size: 8              # total across GPUs; per-GPU = 8 // num_processes(2) = 4
  num_workers: 8

model:
  video_path: null              # NEVER load GemDepth weights; head is random-init
  dinov2_weights: "timm://vit_large_patch14_dinov2.lvd142m"  # official DINOv2 via HF
  require_pretrained_backbone: true
  encoder_decoder_only: true
  head_type: temporal
  use_gem: false
  use_astt: false
  use_temporal: false         # static single-frame: no temporal modeling in the head
  lora: true
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.0

encoder: 'vitl'
pose_flag: false
num_gpus: 2
total_step: 20000
project_name: scratch_ed_dinov2_static
resume: false
