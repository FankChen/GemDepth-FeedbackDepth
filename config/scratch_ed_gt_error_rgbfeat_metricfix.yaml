# Metric-depth module repair pilot/full run for the RGB+Feature GT-camera arm.
# The only methodological change from scratch_ed_gt_error_rgbfeat.yaml is the
# metric-depth parameterization: predict log(Z) directly for loss, and exponentiate
# a bounded copy only for warp. This removes the old log(clamp(Softplus(.))) dead zone.
training:
  seed: 0
  checkpoint_dir: ./checkpoint/scratch_ed_gt_error_rgbfeat_metricfix
  save_freq: 500
  val_freq: 10000
  log_dir: ./logs/scratch_ed_gt_error_rgbfeat_metricfix
  freeze_mode: default
  grad_accum: 1
  aux_depth_weight: 1.0
  aux_depth_space: disparity
  metric_depth_weight: 0.1

optimizer:
  kind: adamw
  learning_rate: 1.0e-4
  dec_lr: 1.0e-4
  other_lr: 1.0e-4
  lora_lr: 1.0e-4
  weight_decay: 0.01

dataset:
  train:
    mode: train
    data_dirs: ['${oc.env:VKITTI_ROOT,/mnt/workspace/vkitti/vkitti/}']
    crop_size: 518
    seq_len: 4
    exclude_scenes: ['Scene20']
  val:
    mode: train
    data_dirs: []
    crop_size: 518
    seq_len: 4
    include_scenes: ['Scene20']

dataloader:
  batch_size: 8
  num_workers: 8

model:
  video_path: null
  dinov2_weights: "timm://vit_large_patch14_dinov2.lvd142m"
  require_pretrained_backbone: true
  encoder_decoder_only: true
  head_type: multiscale_gt_error
  error_signal: rgbfeat
  warp_offsets: [-1, 1]
  metric_depth_mode: log_depth
  metric_init_depth: 20.0
  metric_min_depth: 0.1
  metric_max_depth: 200.0
  use_gem: false
  use_astt: false
  use_temporal: true
  lora: true
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.0

encoder: 'vitl'
pose_flag: false
num_gpus: 2
total_step: 20000
project_name: scratch_ed_gt_error_rgbfeat_metricfix
resume: false
