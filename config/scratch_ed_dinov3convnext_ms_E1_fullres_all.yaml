# Exp E1 (ConvNeXt): 师兄 proposal -- EVERY scale's delta head runs at FULL input resolution
# (fullres_mode=all), no depth feedback. Because every scale then outputs full-res depth, the
# per-scale coarse-to-fine RESOLUTION supervision collapses (all 4 scales fit the same full-res
# GT); coarse-to-fine survives only in the FEATURES (path_4 coarse -> path_1 fine). Video loss.
# Do a short smoke run first (loss decreasing, output not all-zero) before the full 20k.
training:
  seed: 0
  checkpoint_dir: ./checkpoint/scratch_ed_dinov3convnext_ms_E1_fullres_all
  save_freq: 2000
  val_freq: 10000
  log_dir: ./logs/scratch_ed_dinov3convnext_ms_E1_fullres_all
  freeze_mode: default
  grad_accum: 1
  aux_depth_weight: 1.0
  aux_depth_space: disparity

optimizer:
  kind: adamw
  learning_rate: 1.0e-4
  dec_lr: 1.0e-4
  other_lr: 1.0e-4
  lora_lr: 1.0e-4
  weight_decay: 0.01

dataset:
  train:
    mode: train
    data_dirs: ['${oc.env:VKITTI_ROOT,/mnt/workspace/vkitti/vkitti/}']
    crop_size: 448
    seq_len: 4
  val:
    mode: train
    data_dirs: []
    crop_size: 448
    seq_len: 4

dataloader:
  batch_size: 8
  num_workers: 8

model:
  video_path: null
  backbone: dinov3_convnext_s
  backbone_weights: null
  require_pretrained_backbone: true
  encoder_decoder_only: true
  head_type: multiscale
  use_gem: false
  use_astt: false
  use_temporal: true
  lora: true
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.0
  multiscale_native_res: true
  multiscale_fullres_mode: all       # every scale conv+output at full resolution
  multiscale_depth_feedback: false

encoder: 'vitl'
pose_flag: false
multiscale_loss: video           # MultiScaleVideoDepthLoss (disparity + SSI + gradient + temporal)
num_gpus: 1
total_step: 20000
project_name: scratch_ed_dinov3convnext_ms_E1_fullres_all
resume: false
