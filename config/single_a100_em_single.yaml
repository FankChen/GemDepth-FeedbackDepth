# Single-A100 METHOD arm: single-stage error-map DPT head (user scheme, 2026-06-30).
# Inject ONCE at the final decoder feature (path_1): z1 = depth_head1(path_1) drives a t±1
# reprojection warp -> error map -> conv-encode -> CONCAT-fuse with path_1 -> the refined
# feature flows through the ORIGINAL output_conv to produce z'1 (the final depth, main loss).
# z1 is auxiliary-supervised. Freeze everything except the head, fine-tune on VKITTI from the
# pretrained GemDepth weights, evaluate on KITTI. Only the DPT head differs from
# single_a100_baseline.yaml -> controlled comparison.
training:
  seed: 0
  checkpoint_dir: ./checkpoint/single_a100_em_single
  save_freq: 2000
  val_freq: 10000
  log_dir: ./logs/single_a100_em_single
  freeze_mode: head_only      # only the DPT head (incl. error-map modules) is trainable
  grad_accum: 4               # effective batch = batch_size * grad_accum
  aux_depth_weight: 0.1       # supervise the coarse z1 map

optimizer:
  kind: adamw
  learning_rate: 1.0e-4
  dec_lr: 1.0e-5
  other_lr: 1.0e-5            # head params land in the "other" group
  weight_decay: 0.01

dataset:
  train:
    mode: train
    data_dirs: ['${oc.env:VKITTI_ROOT,/home/izi2sgh/MYDATA/vkitti/}']
    crop_size: 518
    seq_len: 16

  val:
    mode: train
    data_dirs: []
    crop_size: 518
    seq_len: 16

dataloader:
  batch_size: 1
  num_workers: 8

model:
  video_path: "./checkpoint/gemdepth.pth"
  head_type: errormap_single
  warp_signal: rgb            # 'rgb' (photometric) or 'feat' (feature-metric)

encoder: 'vitl'
pose_flag: True
num_gpus: 1
total_step: 10000
project_name: video_single_a100_em_single
resume: false
