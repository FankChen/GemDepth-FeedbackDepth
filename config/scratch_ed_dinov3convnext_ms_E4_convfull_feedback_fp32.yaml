# Exp E4 + FP32 head: E4 (all_native + depth feedback) with multiscale_fp32_head=true, so each
# scale's delta head convs run in FP32 (autocast disabled), matching the baseline temporal head which
# computes its final depth regression (output_conv2) in FP32. Pairs with E4 (no fp32) to isolate the
# precision-protection effect on the full-res-convolution base, exactly as E2a_fp32head pairs with
# E2a on the native base. NOTE: fp32 here is the expensive case — all_native runs the convs at full
# input resolution, so 4 full-res FP32 convs per step (more memory / slower than E2a_fp32head). Video loss.
# Do a short smoke run first (loss decreasing, output not all-zero) before the full 20k.
training:
  seed: 0
  checkpoint_dir: ./checkpoint/scratch_ed_dinov3convnext_ms_E4_convfull_feedback_fp32
  save_freq: 2000
  val_freq: 10000
  log_dir: ./logs/scratch_ed_dinov3convnext_ms_E4_convfull_feedback_fp32
  freeze_mode: default
  grad_accum: 1
  aux_depth_weight: 1.0
  aux_depth_space: disparity

optimizer:
  kind: adamw
  learning_rate: 1.0e-4
  dec_lr: 1.0e-4
  other_lr: 1.0e-4
  lora_lr: 1.0e-4
  weight_decay: 0.01

dataset:
  train:
    mode: train
    data_dirs: ['${oc.env:VKITTI_ROOT,/mnt/workspace/vkitti/vkitti/}']
    crop_size: 448
    seq_len: 4
  val:
    mode: train
    data_dirs: []
    crop_size: 448
    seq_len: 4

dataloader:
  batch_size: 8
  num_workers: 8

model:
  video_path: null
  backbone: dinov3_convnext_s
  backbone_weights: null
  require_pretrained_backbone: true
  encoder_decoder_only: true
  head_type: multiscale
  use_gem: false
  use_astt: false
  use_temporal: true
  lora: true
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.0
  multiscale_native_res: true
  multiscale_fullres_mode: all_native   # conv at full res, output resampled back to native res
  multiscale_depth_feedback: true       # encode running depth z, concat onto feature
  multiscale_fp32_head: true            # run delta head convs in FP32 (baseline output_conv2 parity)

encoder: 'vitl'
pose_flag: false
multiscale_loss: video           # MultiScaleVideoDepthLoss (disparity + SSI + gradient + temporal)
num_gpus: 1
total_step: 20000
project_name: scratch_ed_dinov3convnext_ms_E4_convfull_feedback_fp32
