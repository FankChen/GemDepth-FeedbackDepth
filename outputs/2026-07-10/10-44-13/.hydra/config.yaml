training:
  seed: 0
  checkpoint_dir: ./checkpoint/vkitti_baseline
  save_freq: 2000
  val_freq: 10000
  log_dir: ./logs/vkitti_baseline
  freeze_mode: default
  grad_accum: 4
  aux_depth_weight: 0.0
optimizer:
  kind: adamw
  learning_rate: 0.0001
  dec_lr: 1.0e-05
  other_lr: 0.0001
  lora_lr: 0.0001
  weight_decay: 0.01
dataset:
  train:
    mode: train
    data_dirs:
    - ${oc.env:VKITTI_ROOT,/home/izi2sgh/MYDATA/vkitti/}
    crop_size: 518
    seq_len: 16
  val:
    mode: train
    data_dirs: []
    crop_size: 518
    seq_len: 16
dataloader:
  batch_size: 1
  num_workers: 2
model:
  video_path: null
  dinov2_weights: ./checkpoint/dinov2_vitl14_pretrain.pth
  head_type: temporal
  use_gem: false
  use_astt: false
  lora: true
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.0
encoder: vitl
pose_flag: false
num_gpus: 1
total_step: 2
project_name: vkitti_baseline
resume: false
