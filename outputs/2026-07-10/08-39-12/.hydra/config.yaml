training:
  seed: 0
  checkpoint_dir: ./checkpoint/single_a100_baseline
  save_freq: 2000
  val_freq: 10000
  log_dir: ./logs/single_a100_baseline
  freeze_mode: head_only
  grad_accum: 4
  aux_depth_weight: 0.0
optimizer:
  kind: adamw
  learning_rate: 0.0001
  dec_lr: 1.0e-05
  other_lr: 1.0e-05
  weight_decay: 0.01
dataset:
  train:
    mode: train
    data_dirs:
    - ${oc.env:VKITTI_ROOT,/home/izi2sgh/MYDATA/vkitti/}
    crop_size: 518
    seq_len: 16
  val:
    mode: train
    data_dirs: []
    crop_size: 518
    seq_len: 16
dataloader:
  batch_size: 1
  num_workers: 8
model:
  video_path: ./checkpoint/gemdepth.pth
  head_type: temporal
encoder: vitl
pose_flag: true
num_gpus: 1
total_step: 10000
project_name: video_single_a100_baseline
resume: false
